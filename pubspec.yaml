name: utd_store_naiasilaaf
description: "ETS Mobile Programming Lanjut - UTD Store & Crypto Hub"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # 1. Arsitektur, Routing & DI [cite: 21, 22]
  get_it: ^7.6.4
  go_router: ^13.0.0
  
  # 2. Networking & State Management [cite: 26, 27, 30]
  dio: ^5.4.0
  flutter_bloc: ^8.1.3
  
  # 3. Reactive Local Database - Isar [cite: 34, 35]
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.2

  # 4. WebSockets (Bitcoin Price) 
  web_socket_channel: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Isar Generator [cite: 34]
  isar_generator: ^3.1.0
  build_runner: any

flutter:
  uses-material-design: true